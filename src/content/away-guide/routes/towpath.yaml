# Walk by the river from Walton-on-Thames station, on the streets Darren chose
# on 29 September 2026: Ashley Road, the High Street past The Walton Village,
# Bridge Street, Thames Street (Darren's change of 1 October 2026: a short cut
# from the bend in Bridge Street, in place of the foot of Manor Road), Manor
# Road past the Old Manor Inn, The Swan and The Anglers,
# the Thames towpath, and up Waterside Drive. The towpath section is the
# Thames Path National Trail's mapped route (OpenStreetMap relation 14519665)
# between the river end of Manor Road and the river end of Waterside Drive.
# Most of those ways are tagged lit=no in OpenStreetMap; lighting, surface and
# flooding are confirmed on a site visit before anything is stated (plan R6).
#
# Published 21 October 2026 before the site visit, at Darren's request: the
# directions follow the streets Darren specified and were checked against the
# OpenStreetMap geometry; the walk-quality facts below stay unconfirmed.
#
# The pub on Manor Road is the Old Manor Inn: named by Darren, 29 September
# 2026, and mapped under that name in OpenStreetMap. It has no Directory
# listing yet, so it is named without a link. It is a different thing from
# the medieval Old Manor House, which the same step links for its history.
variant: towpath
title: By the river
order: 2
streets: Station Avenue, Ashley Road, High Street, Bridge Street, Thames Street, Manor Road, the Thames Path, Waterside Drive
bestFor:
  unconfirmed:
    ask: site-visit
    question: Is the river route best kept for a daytime walk past the riverside pubs before a Saturday afternoon match?
# Surface and lighting from Darren's site visit of 31 October 2026. Whether
# the towpath floods or gets muddy is still open (sources doc, section 2).
surface:
  value: "The towpath is relatively flat, with a compact, hard surface"
  source:
    label: "Site visit by Darren Bayley"
    basis: editor-observation
    checked: "2026-10-31"
lighting:
  value: "No lighting on the towpath"
  source:
    label: "Site visit by Darren Bayley"
    basis: editor-observation
    checked: "2026-10-31"
stepFree:
  unconfirmed:
    ask: site-visit
    question: Are there steps or gates between Manor Road and the towpath, or between the towpath and Waterside Drive?
afterDark:
  unconfirmed:
    ask: site-visit
    question: Should we advise against the river route after dark?
steps:
  - id: station
    title: Walton-on-Thames station
    text: Leave the station and turn left along Station Avenue.
    lat: 51.37282
    lng: -0.41456
    photo: af-walk-river-step01-landscape
  - id: ashley-road
    title: Ashley Road
    text: At the end of Station Avenue, turn right into Ashley Road and follow it for about a kilometre towards the town centre.
    lat: 51.37294
    lng: -0.42216
    photo: af-walk-river-step02-landscape
  - id: high-street
    title: High Street
    text: Turn left onto the High Street and follow it through the town centre.
    lat: 51.38527
    lng: -0.41865
    photo: af-walk-river-step03-landscape
    pubs:
      - name: The Walton Village
        href: /directory/the-walton-village/
  - id: bridge-street
    title: Bridge Street
    text: Carry straight on from the High Street into Bridge Street.
    lat: 51.38631
    lng: -0.41983
    photo: af-walk-river-step04-landscape
  - id: thames-street
    title: Thames Street
    text: Where Bridge Street bends left, carry straight on into Thames Street.
    lat: 51.38694
    lng: -0.42108
    photo: af-walk-river-step05-landscape
  - id: manor-road
    title: Manor Road
    # The fingerpost: seen and photographed by Darren on his site visit of
    # 31 October 2026, near The Swan. Its own estimate, from that spot, not
    # from the station; not used for the route's overall walking time.
    text: At the end of Thames Street, turn right into Manor Road and follow it down to the river. A fingerpost near The Swan gives the Xcel Sports Centre & Hub as 18 minutes' walk.
    lat: 51.38827
    lng: -0.42306
    photo: af-walk-river-step06-landscape
    pubs:
      - name: Old Manor Inn
      - name: The Swan
        href: /directory/the-swan/
    history:
      href: /history/old-manor-house/
      label: The Old Manor House
  - id: the-anglers
    title: The Anglers and the Thames Path
    text: Manor Road ends at the river beside The Anglers. Turn right onto the Thames Path.
    lat: 51.3900
    lng: -0.4228
    photo: af-walk-river-step07-landscape
    pubs:
      - name: The Anglers
        href: /directory/the-anglers/
  - id: towpath
    title: Along the towpath
    text: Follow the towpath downstream for about a kilometre.
    lat: 51.3928
    lng: -0.4199
    photo: af-walk-river-step08-landscape
    history:
      href: /history/river-thames-at-walton/
      label: The River Thames at Walton
  - id: waterside-drive
    title: Up Waterside Drive
    text: Leave the river at the end of Waterside Drive and walk up Waterside Drive.
    lat: 51.39843
    lng: -0.41471
    photo: af-walk-river-step09-landscape
  - id: ground
    title: Elmbridge Xcel Sports Hub
    text: Turn right for the Sports Hub and follow the signs to the turnstiles.
    lat: 51.39914
    lng: -0.41086
    photo: af-walk-river-step10-landscape
