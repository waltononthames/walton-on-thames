# Club history for the groundhoppers chapter, and the practical and safety
# block. Researched 29 September 2026; see docs/away-fans-guide-sources.md.
#
# The brief mentions "the merger with Walton Casuals". No source found this
# session describes a merger: the club's own history page does not mention
# Walton Casuals, and secondary sources describe the two clubs sharing the
# Sports Hub until Walton Casuals folded. Nothing about Walton Casuals is
# published until Darren confirms what he wants said and a primary source
# supports it.
history:
  - year: "1895"
    f:
      value: Walton FC was formed
      source:
        label: Walton & Hersham FC, History
        url: https://waltonhershamfc.com/club/history/
        basis: organisation-website
        checked: "2026-09-29"
  - year: "1945"
    f:
      value: After the Second World War, Walton FC amalgamated with Hersham FC to form Walton & Hersham FC
      source:
        label: Walton & Hersham FC, History
        url: https://waltonhershamfc.com/club/history/
        basis: organisation-website
        checked: "2026-09-29"
  - year: "1973"
    f:
      value: On 14 April 1973 the club won the FA Amateur Cup at Wembley, in front of 41,000, with a late goal by Roger Connell against Slough Town
      source:
        label: Walton & Hersham FC, History
        url: https://waltonhershamfc.com/club/history/
        basis: organisation-website
        checked: "2026-09-29"
  - year: "2017"
    f:
      value: At the end of September 2017 the club left Stompond Lane, its home for eight decades, when the ground was sold for development, and moved to the new Sports Hub on Waterside Drive
      source:
        label: Walton & Hersham FC, History
        url: https://waltonhershamfc.com/club/history/
        basis: organisation-website
        checked: "2026-09-29"
  - year: "2026"
    f:
      value: The first team plays in the National League South in 2026-27
      source:
        label: Walton & Hersham FC, first team fixtures (Enterprise National League South)
        url: https://waltonhershamfc.com/fixtures/first-team/
        basis: organisation-website
        checked: "2026-09-29"
