# Deliberately NOT named wrangler.toml.
#
# A wrangler.toml in this repository previously caused Cloudflare to treat the
# site as a Worker project and run `npx wrangler deploy` instead of building
# the Astro site, which broke the Pages deploy (see CLAUDE.md: "No
# wrangler.toml: that file caused Cloudflare to run npx wrangler deploy
# (Workers mode) and fail. Do not recreate it."). That incident was a file at
# the repository root and this one is nested, but a non-standard filename
# cannot be auto-detected by anything, which is worth more than the
# convenience of the default name.
#
# Deploy with the config path given explicitly:
#
#   npx wrangler deploy --config workers/apps-court-check/wrangler.deploy.toml
#
# See README.md in this directory.

name = "apps-court-check"
main = "worker.mjs"
compatibility_date = "2026-10-01"

# Cron is UTC-only. 4am and 7pm London are 03:00/18:00 UTC under BST and
# 04:00/19:00 UTC under GMT, so all four fire and the Worker itself discards
# the two that are not 4am or 7pm in London. Minute 5 rather than 0: there is
# no need to hit the farm's site on the exact hour along with everything else.
[triggers]
crons = ["5 3,4,18,19 * * *"]

# Observability keeps the scheduled runs' logs available in the dashboard,
# which is where the answer to the Cloudflare question will show up if the
# cron run is reached before the manual endpoint is tried.
[observability]
enabled = true
