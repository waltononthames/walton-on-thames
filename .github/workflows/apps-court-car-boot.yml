name: Apps Court car boot status

# Checks whether this Sunday's car boot sale is on and commits the answer to
# src/data/apps-court-status.json, which triggers the Pages deploy.
#
# IT IS DORMANT UNTIL CONFIGURED, and will say so in its own log. The farm's
# site refuses this runner: six curl variants (HTTP/2, HTTP/1.1, TLS 1.3, full
# browser headers, no user-agent) and a real headless Chromium were all served
# a Cloudflare challenge from GitHub's address range, as was a Cloudflare
# Worker. The same curl build returns 200 from a domestic connection, so the
# zone weighs the address as well as the client fingerprint.
#
# Rather than fail twice a day forever, the job exits cleanly with setup
# instructions until a fetch route is configured. The page meanwhile shows how
# old its reading is and tells readers to check the farm's own page, so a
# dormant job degrades honestly instead of going quiet.
#
# Everything here also runs unchanged from any machine on a domestic
# connection, with no account and no third party: leave CARBOOT_FETCH_STRATEGY
# unset and cron `node tools/apps-court-check/run-check.mjs --write`.

on:
  schedule:
    # GitHub cron is UTC. 4am and 7pm London are 03:00/18:00 UTC under BST and
    # 04:00/19:00 under GMT, so both pairs fire and the first step keeps the
    # pair that matches London's current offset. An earlier version used a
    # `timezone:` key on the schedule entry, which is not documented GitHub
    # workflow syntax; if it is ignored the check drifts an hour every summer.
    #
    # Keep these as two separate entries: the first step tells them apart by
    # github.event.schedule, NOT by the clock when the job starts. GitHub
    # delays scheduled runs, sometimes by hours: on 26 October 2026 the 19:05
    # UTC firing started at 22:35, and the old wall-clock test (hour must be 4
    # or 19) threw it away as a duplicate, so the evening check never ran.
    - cron: '5 3,18 * * *'   # 4am and 7pm under BST
    - cron: '5 4,19 * * *'   # 4am and 7pm under GMT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read and report without publishing'
        type: boolean
        default: true
      force_direct:
        description: 'Try reading the source directly from the runner (expected to be refused; use to re-test whether that has changed)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apps-court-car-boot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Room for the ~20-minute live deployment check on top of the read and build.
    timeout-minutes: 35
    steps:
      - name: Is this the 4am or 7pm London firing?
        id: when
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          echo "London time is $(TZ=Europe/London date +'%Y-%m-%d %H:%M %Z')"
          # The offset decides which schedule entry is the real one, so a run
          # GitHub started late is still kept. Only the BST/GMT pairing matters.
          if [ "$(TZ=Europe/London date +%z)" = '+0100' ]; then WANT='5 3,18 * * *'; else WANT='5 4,19 * * *'; fi
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo 'Manual run: proceeding whatever the hour.'
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "$WANT" ]; then
            echo "Fired by '${SCHEDULE}', the entry for London's current offset."
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          else
            echo "Fired by '${SCHEDULE}', the entry for the other half of the year: skipped."
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Is a usable fetch route configured?
        id: config
        if: steps.when.outputs.proceed == 'true'
        env:
          TEMPLATE: ${{ secrets.CARBOOT_FETCH_TEMPLATE }}
          FORCE_DIRECT: ${{ inputs.force_direct }}
        run: |
          set -euo pipefail
          if [ -n "$TEMPLATE" ]; then
            echo 'strategy=template' >> "$GITHUB_OUTPUT"
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          elif [ "$FORCE_DIRECT" = 'true' ]; then
            echo 'Forcing a direct read. This is expected to be refused by Cloudflare.'
            echo 'strategy=direct' >> "$GITHUB_OUTPUT"
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            cat <<'NOTE'
          Not configured, so nothing was checked and nothing was published.

          This runner cannot read appscourtfarm.com directly: Cloudflare serves
          it a challenge. Measured from a GitHub runner, all of these were
          refused -- curl over HTTP/2, HTTP/1.1 and TLS 1.3, with browser
          headers and with none, and a real headless Chromium -- while the same
          curl build returns 200 from a domestic connection.

          Two ways to finish this off:

          1. A machine on a domestic connection (a Raspberry Pi, a NAS, any
             always-on box). No account, no third party, no monthly cost. Cron
             `node tools/apps-court-check/run-check.mjs --write` twice a day.
             The code needs no changes: direct is the default.

          2. A fetch service that egresses residentially. Set two repository
             secrets under Settings > Secrets and variables > Actions:
               CARBOOT_FETCH_TEMPLATE  e.g. https://api.example.com/?api_key={key}&url={url}
               CARBOOT_FETCH_KEY       your API key
             {url} is required; {key} is filled from the second secret. Note
             that this deliberately routes around protection the farm enabled.

          Exiting 0: an unconfigured job should not email a failure twice a day.
          The page itself shows how old its reading is, so readers are not
          misled while this waits.
          NOTE
          fi

      - uses: actions/checkout@v7
        if: steps.config.outputs.proceed == 'true'
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: steps.config.outputs.proceed == 'true'
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
        if: steps.config.outputs.proceed == 'true'

      # Not allowed to abort the run. These tests guard the PUBLISH path, and
      # a fault in them should not stop the check finding out what the farm
      # says: on 26 October a test that asserted a now-quiet refusal still
      # exited non-zero took down the whole scheduled job before it ever
      # reached the source. The job still ends red (see the last step) and
      # publishing is blocked below, but the read and its report still happen,
      # which is what makes the failure diagnosable.
      - name: Test the refusal and publication rules
        id: tests
        if: steps.config.outputs.proceed == 'true'
        continue-on-error: true
        run: node --test tools/apps-court-check/*.test.mjs

      # The CLI tests exercise the real run-check against a stubbed curl, so
      # they write the status file and restore it. If that restore ever failed,
      # the publish step below would commit a test fixture to the live site.
      # Cheap insurance: start the real check from a pristine record.
      - name: Discard any test writes to the status record
        if: steps.config.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/data/apps-court-status.json; then
            echo 'Status file was modified by the test run; restoring it before the real check.'
            git checkout -- src/data/apps-court-status.json
          fi

      - name: Read the official notice
        if: steps.config.outputs.proceed == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CARBOOT_FETCH_STRATEGY: ${{ steps.config.outputs.strategy }}
          CARBOOT_FETCH_TEMPLATE: ${{ secrets.CARBOOT_FETCH_TEMPLATE }}
          CARBOOT_FETCH_KEY: ${{ secrets.CARBOOT_FETCH_KEY }}
        run: |
          set -euo pipefail
          # Exit 1 means the source could not be read or could not be
          # understood, and that NOTHING was changed. Letting that fail the job
          # is deliberate: the page is then older than it looks. It is never a
          # reason to write a guess.
          if [ "$DRY_RUN" = 'true' ]; then
            node tools/apps-court-check/run-check.mjs | tee carboot-report.json
          else
            node tools/apps-court-check/run-check.mjs --write | tee carboot-report.json
          fi

      # On the run's own page, so a failure explains itself without anyone
      # downloading and unzipping an artifact to find out what happened.
      - name: Show what was read
        if: always() && steps.config.outputs.proceed == 'true'
        run: |
          {
            echo '### What the check read'
            echo
            if [ -s carboot-report.json ]; then
              echo '```json'
              cat carboot-report.json
              echo '```'
            else
              echo 'The read step produced no report at all, so it failed before reaching the source.'
              echo 'Look at the step above this one in the log.'
            fi
            echo
            echo "Test suite: \`${{ steps.tests.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Publishing additionally requires the tests to have passed: a read is
      # harmless, a publish from unverified code is not.
      - name: Validate the built page, then publish
        id: publish
        if: steps.config.outputs.proceed == 'true' && inputs.dry_run != true && github.ref == 'refs/heads/main' && steps.tests.outcome == 'success'
        run: |
          set -euo pipefail
          echo 'published=false' >> "$GITHUB_OUTPUT"
          if git diff --quiet -- src/data/apps-court-status.json; then
            echo 'The reading did not change the record; nothing to publish.'
            exit 0
          fi

          # Build and check the rendered page BEFORE committing, so a bad
          # record can never reach readers: no date the farm did not state, and
          # no cancelled sale published as scheduled.
          npm run build
          node tools/apps-court-check/verify-built.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/apps-court-status.json
          git commit -m 'Update Apps Court car boot status from the official notice'
          # Generated AFTER the content commit so its own date is in history.
          # Both commits travel in the same push; never continue on failure.
          node scripts/generate-lastmod.mjs
          git add src/data/lastmod.json
          git diff --cached --quiet || git commit -m 'Update sitemap dates for Apps Court status'
          # A concurrent change to main rejects this push. Never rebase a
          # verdict onto unseen content or force-push: a later check reads again.
          git push origin HEAD:main
          echo 'published=true' >> "$GITHUB_OUTPUT"

      # ONLY when something was actually published. Previously this ran on
      # every non-dry run, so a correct refusal -- the farm not having posted
      # for the coming Sunday yet, which is most weekdays -- failed the job
      # because there was no new timestamp to look for. It would have reported
      # a fault twice a day for the ordinary course of business.
      - name: Verify the public deployment
        if: steps.publish.outputs.published == 'true'
        run: node tools/apps-court-check/verify-live.mjs

      - name: Retain the check report
        if: always() && steps.config.outputs.proceed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apps-court-check-${{ github.run_id }}
          path: carboot-report.json
          retention-days: 14

      - name: Fail the run if the tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo 'The test suite failed. The source was still read and its report retained above,'
          echo 'but nothing was published. Fix the tests before trusting the next publish.'
          exit 1

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo '### Apps Court check failed'
            echo
            if [ "${{ steps.publish.outputs.published }}" = 'true' ]; then
              echo 'The new reading WAS published to main, but the public page did not show it within about 20 minutes. Check the Pages deploy and the Cloudflare HTML cache rule before assuming anything is wrong with the reading.'
            else
              echo 'Nothing was published. The status file is untouched and the page still shows its previous reading, with its age.'
            fi
            echo
            echo 'Download the `carboot-report.json` artifact for the exact reason. Common ones:'
            echo '- `"result": "unreadable"` with HTTP 403: the fetch route was refused by Cloudflare.'
            echo '- `"action": "none"` with a reason about the date: the farm left a notice up past its Sunday. Correct behaviour; no action needed unless it persists.'
            echo '- A failed deployment check: the commit landed but the public page has not shown it yet. Check the Pages deploy and the Cloudflare HTML cache rule.'
          } >> "$GITHUB_STEP_SUMMARY"
