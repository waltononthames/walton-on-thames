name: Apps Court car boot status

on:
  schedule:
    - cron: '5 4,19 * * *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read and report without publishing'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: apps-court-car-boot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test refusal and publication rules
        run: node --test tools/apps-court-check/*.test.mjs
      - name: Read the official notice directly
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = 'true' ]; then
            node tools/apps-court-check/run-check.mjs | tee carboot-report.json
          else
            node tools/apps-court-check/run-check.mjs --write | tee carboot-report.json
          fi
      - name: Validate and publish
        if: inputs.dry_run != true && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          npm run build
          node tools/apps-court-check/verify-built.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/apps-court-status.json
          git commit -m 'Verify Apps Court official dated notice'
          # Generate AFTER the content commit so its new date is in history.
          # Both commits travel in the same push; never continue on failure.
          node scripts/generate-lastmod.mjs
          git add src/data/lastmod.json
          git diff --cached --quiet || git commit -m 'Update sitemap dates for Apps Court verification'
          # A concurrent main change rejects this push. Never rebase a verdict
          # onto unseen content or force-push; a later check must read again.
          git push origin HEAD:main
      - name: Verify the public deployment
        if: inputs.dry_run != true && github.ref == 'refs/heads/main'
        run: node tools/apps-court-check/verify-live.mjs
      - name: Retain the check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apps-court-check-${{ github.run_id }}
          path: carboot-report.json
          retention-days: 14
      - name: Explain failure
        if: failure()
        run: |
          echo '### Apps Court verification failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect the report/logs. A failed source read publishes nothing. A failed deployment check means the public site has not been verified. Do not treat the last success timestamp as a new check.' >> "$GITHUB_STEP_SUMMARY"
