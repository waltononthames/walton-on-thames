name: IndexNow submission

# Notifies IndexNow (Bing, Yandex, Seznam, Naver, Yep — not Google, which
# doesn't participate in the protocol) whenever the site changes, so those
# search engines pick up new/updated pages faster than waiting on their own
# crawl schedule. Also runs daily shortly after the existing rebuild cron,
# to catch content changes driven purely by date (e.g. fixtures/events
# rotating in and out) that don't involve a git push.
#
# Note: the very first run(s) after adding a new IndexNow key can fail with
# "SiteVerificationNotCompleted" — IndexNow needs time to independently crawl
# and confirm the key file before it will accept submissions. This clears up
# on its own; no action needed beyond letting it retry on the next run.

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 1 * * *'   # 01:10 UTC daily, 10 min after the Cloudflare rebuild hook fires
  workflow_dispatch:        # allows manual trigger from GitHub Actions UI

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for Cloudflare Pages deploy to finish
        if: github.event_name == 'push'
        run: sleep 90

      - name: Submit sitemap URLs to IndexNow
        run: node scripts/submit-indexnow.mjs
